<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIL Pipeline Dashboard</title>
<style>
  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --surface-2: #1a2332;
    --border: #1e2d3d;
    --text: #e2e8f0;
    --text-dim: #8892a4;
    --accent: #3b82f6;
    --accent-glow: rgba(59,130,246,0.15);
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
    --purple: #a855f7;
    --cyan: #06b6d4;
    --radius: 10px;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .header h1 span { color: var(--accent); }

  .header-meta {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .main { padding: 24px 28px; }

  .pipeline {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 20px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 24px;
    overflow-x: auto;
  }

  .pipeline-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 100px;
    padding: 12px;
    border-radius: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
  }

  .pipeline-stage:hover { border-color: var(--accent); background: var(--accent-glow); }
  .pipeline-stage.active { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

  .pipeline-stage .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); }
  .pipeline-stage .count { font-size: 24px; font-weight: 700; font-family: var(--mono); }

  .pipeline-arrow { color: var(--text-dim); font-size: 18px; }

  .stage-incoming .count { color: var(--cyan); }
  .stage-running .count { color: var(--amber); }
  .stage-validating .count { color: var(--purple); }
  .stage-done .count { color: var(--green); }
  .stage-failed .count { color: var(--red); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }

  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card-header .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--accent-glow);
    color: var(--accent);
  }

  .card-body { padding: 16px 18px; max-height: 340px; overflow-y: auto; }

  .task-item {
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 8px;
    background: var(--surface-2);
    border-left: 3px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
  }

  .task-item:hover { border-left-color: var(--accent); }
  .task-item.done { border-left-color: var(--green); }
  .task-item.failed { border-left-color: var(--red); }
  .task-item.running { border-left-color: var(--amber); }

  .task-item .goal { font-size: 13px; font-weight: 500; margin-bottom: 4px; }

  .task-item .meta {
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .manifest-item {
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 8px;
    background: var(--surface-2);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .manifest-item:hover { background: var(--accent-glow); }

  .manifest-item .id { font-family: var(--mono); color: var(--accent); font-size: 11px; }
  .manifest-item .goal { margin-top: 4px; color: var(--text); }
  .manifest-item .decision { font-family: var(--mono); font-size: 11px; }
  .manifest-item .decision.done { color: var(--green); }
  .manifest-item .decision.failed { color: var(--red); }

  .agent-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 8px;
    background: var(--surface-2);
  }

  .agent-name {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    min-width: 90px;
  }

  .agent-status {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .agent-status.idle { background: rgba(34,197,94,0.15); color: var(--green); }
  .agent-status.busy { background: rgba(245,158,11,0.15); color: var(--amber); }

  .memory-item {
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 6px;
    background: var(--surface-2);
    font-size: 12px;
  }

  .memory-item .goal { color: var(--text); margin-bottom: 2px; }
  .memory-item .detail { color: var(--text-dim); font-size: 11px; }

  .log-line {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.6;
    color: var(--text-dim);
    padding: 1px 0;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .full-width { grid-column: 1 / -1; }

  .submit-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }

  .submit-bar input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .submit-bar input:focus { border-color: var(--accent); }

  .submit-bar button {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .submit-bar button:hover { opacity: 0.85; }
  .submit-bar button:disabled { opacity: 0.4; cursor: not-allowed; }

  .empty { color: var(--text-dim); font-size: 12px; text-align: center; padding: 20px; }

  .detail-panel {
    position: fixed;
    top: 0; right: -480px;
    width: 460px;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 100;
    transition: right 0.3s;
    overflow-y: auto;
    padding: 20px;
  }

  .detail-panel.open { right: 0; }

  .detail-panel .close-btn {
    position: absolute;
    top: 14px; right: 14px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
  }

  .detail-panel h2 { font-size: 15px; margin-bottom: 16px; }

  .detail-panel pre {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
    background: var(--surface-2);
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text-dim);
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 99;
    display: none;
  }

  .overlay.visible { display: block; }
</style>
</head>
<body>

<header class="header">
  <h1><span>AIL</span> Pipeline Dashboard</h1>
  <div class="header-meta">
    <span><span class="status-dot"></span> System Online</span>
    <span id="manifest-count">— manifests</span>
    <span id="memory-count">— memories</span>
  </div>
</header>

<main class="main">

  <div class="pipeline" id="pipeline"></div>

  <div class="submit-bar">
    <input type="text" id="goal-input" placeholder="Submit a goal... (e.g. 'Write healthcheck function')" />
    <button id="submit-btn" onclick="submitGoal()">Execute</button>
  </div>

  <div class="grid">

    <div class="card">
      <div class="card-header">
        Recent Tasks
        <span class="badge" id="tasks-badge">0</span>
      </div>
      <div class="card-body" id="tasks-list"></div>
    </div>

    <div class="card">
      <div class="card-header">
        Execution Manifests
        <span class="badge" id="manifests-badge">0</span>
      </div>
      <div class="card-body" id="manifests-list"></div>
    </div>

    <div class="card">
      <div class="card-header">Agents</div>
      <div class="card-body" id="agents-list"></div>
    </div>

    <div class="card">
      <div class="card-header">
        Agent Memory
        <span class="badge" id="memory-badge">0</span>
      </div>
      <div class="card-body" id="memory-list"></div>
    </div>

    <div class="card full-width">
      <div class="card-header">System Log</div>
      <div class="card-body" id="log-list" style="max-height:200px"></div>
    </div>

  </div>
</main>

<div class="overlay" id="overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detail-panel">
  <button class="close-btn" onclick="closeDetail()">&times;</button>
  <h2 id="detail-title">Details</h2>
  <pre id="detail-content"></pre>
</div>

<script>
const API = '';

async function api(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

function $(id) { return document.getElementById(id); }

async function loadStatus() {
  try {
    const s = await api('/api/status');

    const stages = ['incoming', 'running', 'validating', 'done', 'failed'];
    const pipeline = $('pipeline');
    pipeline.innerHTML = stages.map((st, i) => {
      const count = s.task_counts[st] || 0;
      const arrow = i < stages.length - 1 ? '<span class="pipeline-arrow">→</span>' : '';
      return `<div class="pipeline-stage stage-${st}" onclick="filterTasks('${st}')">
        <span class="label">${st}</span>
        <span class="count">${count}</span>
      </div>${arrow}`;
    }).join('');

    $('manifest-count').textContent = `${s.manifest_count} manifests`;
    $('memory-count').textContent = `${s.memory_entries} memories`;
  } catch (e) {
    console.error('Status error:', e);
  }
}

async function loadTasks(stage) {
  try {
    const query = stage ? `?stage=${stage}` : '';
    const data = await api(`/api/tasks${query}`);
    const list = $('tasks-list');
    $('tasks-badge').textContent = data.count;

    if (!data.tasks.length) {
      list.innerHTML = '<div class="empty">No tasks</div>';
      return;
    }

    list.innerHTML = data.tasks.slice(0, 20).map(t => {
      const status = t._stage || t.status || 'pending';
      return `<div class="task-item ${status}" onclick="showTask('${t.task_id}')">
        <div class="goal">${esc(t.goal)}</div>
        <div class="meta">
          <span>${t.task_id}</span>
          <span>${t.role}</span>
          <span>${status}</span>
          <span>${t.steps ? t.steps.length : 0} steps</span>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    $('tasks-list').innerHTML = '<div class="empty">Failed to load tasks</div>';
  }
}

async function loadManifests() {
  try {
    const data = await api('/api/manifests?limit=15');
    const list = $('manifests-list');
    $('manifests-badge').textContent = data.count;

    if (!data.manifests.length) {
      list.innerHTML = '<div class="empty">No manifests yet</div>';
      return;
    }

    list.innerHTML = data.manifests.map(m => `
      <div class="manifest-item" onclick="showManifest('${m.task_id}')">
        <div class="id">${m.manifest_id}</div>
        <div class="goal">${esc(m.goal)}</div>
        <div class="decision ${m.decision}">${m.decision} · ${m.duration_ms}ms · ${m.executions.length} exec(s)</div>
      </div>
    `).join('');
  } catch (e) {
    $('manifests-list').innerHTML = '<div class="empty">Failed to load manifests</div>';
  }
}

async function loadAgents() {
  try {
    const agents = await api('/api/agents');
    const list = $('agents-list');

    const names = Object.keys(agents);
    if (!names.length) {
      list.innerHTML = `
        <div class="agent-row">
          <span class="agent-name">opencode</span>
          <span class="agent-status idle">idle</span>
          <span style="color:var(--text-dim);font-size:11px">Programmer</span>
        </div>
        <div class="agent-row">
          <span class="agent-name">openclaw</span>
          <span class="agent-status idle">idle</span>
          <span style="color:var(--text-dim);font-size:11px">Operator</span>
        </div>`;
      return;
    }

    list.innerHTML = names.map(n => {
      const a = agents[n];
      const st = a.status || 'idle';
      return `<div class="agent-row">
        <span class="agent-name">${n}</span>
        <span class="agent-status ${st}">${st}</span>
        <span style="color:var(--text-dim);font-size:11px">${a.current_task || '—'}</span>
      </div>`;
    }).join('');
  } catch (e) {
    $('agents-list').innerHTML = '<div class="empty">Failed to load agents</div>';
  }
}

async function loadMemory() {
  try {
    const data = await api('/api/memory');
    const list = $('memory-list');
    $('memory-badge').textContent = data.entries_count;

    const patterns = [...(data.success_patterns || []), ...(data.error_patterns || [])];
    if (!patterns.length) {
      list.innerHTML = '<div class="empty">No memory entries yet</div>';
      return;
    }

    list.innerHTML = patterns.slice(0, 10).map(p => {
      const isError = !!p.errors;
      return `<div class="memory-item">
        <div class="goal">${isError ? '✗' : '✓'} ${esc(p.goal)}</div>
        <div class="detail">${p.task_id}${isError ? ' — ' + esc(p.errors[0] || '') : ''}</div>
      </div>`;
    }).join('');
  } catch (e) {
    $('memory-list').innerHTML = '<div class="empty">Failed to load memory</div>';
  }
}

async function loadLogs() {
  try {
    const data = await api('/api/logs?limit=30');
    const list = $('log-list');
    if (!data.lines.length) {
      list.innerHTML = '<div class="empty">No log entries</div>';
      return;
    }
    list.innerHTML = data.lines.map(l => `<div class="log-line">${esc(l)}</div>`).join('');
    list.scrollTop = list.scrollHeight;
  } catch (e) {
    $('log-list').innerHTML = '<div class="empty">Failed to load logs</div>';
  }
}

async function showTask(taskId) {
  try {
    const data = await api(`/api/tasks/${taskId}`);
    openDetail(`Task: ${taskId}`, JSON.stringify(data, null, 2));
  } catch (e) {
    openDetail('Error', e.message);
  }
}

async function showManifest(taskId) {
  try {
    const data = await api(`/api/manifests/${taskId}`);
    openDetail(`Manifest: ${taskId}`, JSON.stringify(data, null, 2));
  } catch (e) {
    openDetail('Error', e.message);
  }
}

function openDetail(title, content) {
  $('detail-title').textContent = title;
  $('detail-content').textContent = content;
  $('detail-panel').classList.add('open');
  $('overlay').classList.add('visible');
}

function closeDetail() {
  $('detail-panel').classList.remove('open');
  $('overlay').classList.remove('visible');
}

function filterTasks(stage) {
  document.querySelectorAll('.pipeline-stage').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  loadTasks(stage);
}

async function submitGoal() {
  const input = $('goal-input');
  const btn = $('submit-btn');
  const goal = input.value.trim();
  if (!goal) return;

  btn.disabled = true;
  btn.textContent = 'Running...';

  try {
    const res = await fetch('/api/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ goal }),
    });
    const data = await res.json();
    openDetail(`Result: ${data.task_id}`, JSON.stringify(data, null, 2));
    input.value = '';
    refreshAll();
  } catch (e) {
    openDetail('Error', e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Execute';
  }
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function refreshAll() {
  loadStatus();
  loadTasks();
  loadManifests();
  loadAgents();
  loadMemory();
  loadLogs();
}

$('goal-input').addEventListener('keydown', e => { if (e.key === 'Enter') submitGoal(); });

refreshAll();
setInterval(refreshAll, 10000);
</script>
</body>
</html>
